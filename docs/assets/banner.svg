<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Vesper</title>
  <desc id="d">Vesper: an AI agent that watches your GitHub repositories and opens pull requests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.22" r="0.5">
      <stop offset="0" stop-color="#f5b14c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5b14c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <!-- the evening star -->
  <circle cx="1180" cy="92" r="10" fill="#ffd27a"/>
  <circle cx="1180" cy="92" r="26" fill="none" stroke="#ffd27a" stroke-opacity="0.35" stroke-width="2"/>
  <!-- a pull request, drawn as git lines -->
  <g transform="translate(160 0)" fill="none" stroke="#8b9cff" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M900 330 V250"/>
    <path d="M900 250 C900 205 980 205 980 170"/>
    <path d="M980 170 V140" stroke-dasharray="2 10"/>
  </g>
  <g transform="translate(160 0)" fill="#0b1020" stroke="#8b9cff" stroke-width="4">
    <circle cx="900" cy="330" r="11"/>
    <circle cx="900" cy="250" r="11"/>
    <circle cx="980" cy="170" r="11" fill="#8b9cff"/>
  </g>
  <text x="96" y="190" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-3">Vesper</text>
  <text x="100" y="250" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#c9d1ff">Your repos, reviewed while you sleep.</text>
  <text x="100" y="300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8b93b8">An AI agent that watches GitHub and opens the pull request — with your own model key.</text>
</svg>
