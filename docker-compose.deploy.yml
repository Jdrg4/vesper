# docker-compose.deploy.yml
#
# Compose de PRODUCCION para Coolify (build_pack=dockercompose). Distinto del
# compose de desarrollo local. Reglas:
#
#   - NINGUN servicio publica `ports:`. Coolify los honra y un `8000:8000`
#     chocaria con el propio Coolify. Solo `expose` interno entre servicios.
#   - SOLO el `frontend` recibe dominio publico, via `docker_compose_domains`
#     de Coolify (Traefik) — NUNCA `fqdn`. El `backend` jamas es publico:
#     asi los secretos (Zen key, JWT_SECRET, GitHub App key, credenciales
#     de BD) nunca llegan al navegador.
#   - `postgres`: volumen en `/var/lib/postgresql/data` (la ruta EXACTA de
#     PGDATA de la imagen oficial `postgres:16`). `start_period` generoso.
#   - `redis`: cola de jobs (F5+) + pub/sub de progreso del agente (F4+).
#     Opcional en F1; el backend degrada con gracia sin el.
#   - El dominio del frontend se asigna en Coolify DESPUES del primer deploy
#     (que puebla `docker_compose_raw`).
#
# Todas las variables sensibles vienen de `${VAR}` (env vars puestas en
# Coolify) — nunca hardcodeadas aqui. Ver `.env.deploy.example`.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./vesper-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &backend-env
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      # Obligatoria: con environment=production el backend no arranca con la de
      # desarrollo. Perderla = perder las credenciales de IA de todos los tenants.
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Cerrado por defecto: solo se permite la primera cuenta. Hasta que cada job
      # corra en su contenedor, abrirlo expone los clones de unos tenants a otros.
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Zen gateway (F4+). Solo backend, nunca bundle del frontend.
      OPENCODE_ZEN_KEY: ${OPENCODE_ZEN_KEY:-}
      OPENCODE_ZEN_BASE_URL: ${OPENCODE_ZEN_BASE_URL:-https://opencode.ai/zen/go/v1}
      ALLOW_INSTANCE_KEY_FALLBACK: ${ALLOW_INSTANCE_KEY_FALLBACK:-false}
      # Agent runtime (F4+ / F6b). Con AGENT_ENGINE=opencode corre local; con
      # AGENT_ENGINE=docker lanza un contenedor por job en el anfitrion de jobs
      # (ver deploy/jobs-host/README.md).
      OPENCODE_BIN: ${OPENCODE_BIN:-/usr/local/bin/opencode}
      OPENCODE_PORT_POOL_START: ${OPENCODE_PORT_POOL_START:-14096}
      WORKSPACE_ROOT: /var/workspaces
      AGENT_ENGINE: ${AGENT_ENGINE:-opencode}
      AGENT_IMAGE: ${AGENT_IMAGE:-vesper-agent:1}
      AGENT_DOCKER_NETWORK: ${AGENT_DOCKER_NETWORK:-vesper-jobs}
      AGENT_JOB_CPUS: ${AGENT_JOB_CPUS:-2}
      AGENT_JOB_MEMORY: ${AGENT_JOB_MEMORY:-4g}
      AGENT_MAX_JOBS: ${AGENT_MAX_JOBS:-3}
      DOCKER_HOST: ${DOCKER_HOST:-}
      DOCKER_TLS_VERIFY: ${DOCKER_TLS_VERIFY:-}
      DOCKER_CERT_PATH: ${DOCKER_CERT_PATH:-}
      # GitHub App (F3+).
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    expose:
      - "8000"
    # El backend NUNCA es publico. El frontend lo alcanza por la red interna
    # via sus API routes (NEXT_PUBLIC_API_URL -> /api/* -> backend:8000).
    volumes:
      # Workspaces efimeros por job (F4+): clones shallow de los repos del
      # tenant. No commitear el contenido; solo el mountpoint.
      - workspaces:/var/workspaces
      # Certificados TLS de cliente para el anfitrion de jobs (F6b, solo lectura).
      - docker_certs:/run/docker-certs:ro

  # Cola de jobs + cron de las watch_rules + recogida de jobs colgados. Sin el,
  # ningun repo se vigila y nada lo avisa. Misma imagen que el backend; arranca
  # cuando el backend esta sano (ya migro) y no vuelve a migrar.
  worker:
    build:
      context: ./vesper-backend
      dockerfile: Dockerfile
    command: ["arq", "src.worker.WorkerSettings"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *backend-env
    healthcheck:
      disable: true
    volumes:
      - workspaces:/var/workspaces
      - docker_certs:/run/docker-certs:ro

  frontend:
    build:
      context: ./vesper-frontend
      dockerfile: Dockerfile
      args:
        # Build-time: se incrustan en el bundle. Si cambia el dominio del API
        # hay que REBUILD. (Ver `.claude/rules/produccion-deploy.md`.)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SSE_URL: ${NEXT_PUBLIC_SSE_URL}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # URL interna del backend para server-side fetch (route handlers / RSC).
      BACKEND_INTERNAL_URL: http://backend:8000
    expose:
      - "3000"
    # UNICO servicio publico del stack. En Coolify: asignar dominio con
    # `docker_compose_domains` (Traefik), NO `fqdn`.

  redis:
    image: redis:7
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  workspaces:
  docker_certs:
