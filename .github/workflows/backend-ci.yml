# Workflow: ruff + pytest (con coverage) para vesper-backend, contra Postgres 16 real.
name: Backend CI

on:
  # Permite relanzar el gate a mano (util cuando los filtros `paths` no
  # disparan el workflow, p.ej. en el primer push de una rama).
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vesper-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "vesper-backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Ruff + Pytest — Python 3.12
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vesper-backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vesper
          POSTGRES_PASSWORD: vesper
          POSTGRES_DB: vesper_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # conftest.py apunta directo a vesper_test en localhost:55432, pero el
      # seed y cualquier código que resuelva settings.database_url (incluido
      # Alembic si se corriera aquí) necesitan esta variable.
      DATABASE_URL: postgresql+asyncpg://vesper:vesper@localhost:55432/vesper_test
      JWT_SECRET: test-jwt-secret-de-al-menos-32-caracteres-para-ci
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vesper-backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Verificar format (ruff format --check)
        run: ruff format --check .

      - name: Ejecutar tests con coverage
        run: pytest --cov=src --cov-report=term-missing
